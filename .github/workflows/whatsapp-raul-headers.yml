name: Confirmed Raul order WhatsApp labels
on:
  push:
    branches:
      - fix/whatsapp-raul-headers-confirmation-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify WhatsApp date-first and scheduling review logic
        run: node --test tests/whatsapp-raul.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          test -x "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Verify manual WhatsApp drafts on mobile and Levan case
        run: node tests/whatsapp-raul-browser.cjs
      - name: Preserve order filters
        run: node tests/order-filters-mobile.cjs
      - name: Preserve calendar date input
        run: node tests/calendar-date-width.cjs
