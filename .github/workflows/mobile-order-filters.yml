name: Mobile order filters browser checks
on:
  push:
    branches:
      - fix/mobile-order-filter-sheet-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare browser test runtime
        run: |
          node --version
          npm --version
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          test -x "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Check iPhone, Android and desktop filter interactions (synthetic data, no production writes)
        run: node tests/order-filters-mobile.cjs
