name: Compact WhatsApp Raul order drafts
on:
  push:
    branches:
      - fix/whatsapp-raul-compact-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check WhatsApp format and schedule warnings
        run: node --test tests/whatsapp-raul.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          test -x "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Check iPhone WhatsApp behavior, cancellation, and preliminary draft
        run: node tests/whatsapp-raul-browser.cjs
      - name: Check existing order filters
        run: node tests/order-filters-mobile.cjs
      - name: Check existing calendar date field
        run: node tests/calendar-date-width.cjs
