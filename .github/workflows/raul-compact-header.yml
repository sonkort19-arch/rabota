name: Raul compact header checks
on:
  pull_request:
    paths:
      - 'money-workspace.css'
      - 'index.html'
      - 'tests/master-dense-layout.cjs'
      - '.github/workflows/raul-compact-header.yml'
  push:
    branches: [main]
    paths:
      - 'money-workspace.css'
      - 'index.html'
      - 'tests/master-dense-layout.cjs'
      - '.github/workflows/raul-compact-header.yml'
permissions:
  contents: read
jobs:
  mobile-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify Raul's compact header in iPhone Safari
        run: node tests/master-dense-layout.cjs
