name: Final architecture audit stage 10
on:
  push:
    branches:
      - feature/stage-10-final-audit-20261114
  pull_request:
    paths:
      - index.html
      - '*.js'
      - '*.css'
      - 'tests/**'
      - 'qa/autonomy-progress.json'
      - 'qa/AUTONOMOUS_IMPROVEMENT_ROADMAP.md'
      - 'qa/POST_FINANCE_MIGRATION_STATUS_20261114.md'
      - '.github/workflows/stage10-final-audit.yml'
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Module architecture contracts
        run: node --test tests/stage10-contracts.test.cjs tests/autonomous-roadmap-contract.test.cjs
      - name: All extracted modules
        run: |
          node --test tests/app-services.test.cjs tests/order-sync.test.cjs tests/order-model.test.cjs tests/calendar-model.test.cjs tests/finance-model.test.cjs tests/master-ui.test.cjs tests/lead-ai-bridge.test.cjs
      - name: Exact CSS preservation and old UI smoke
        run: |
          node --test tests/css-stage8-regression.test.cjs tests/quick-slots.cjs tests/master-dashboard.cjs tests/master-owner-cards.cjs tests/ui-icon-layout.test.js
      - name: Orders, payments and mobile-form regression checks
        run: |
          node --test tests/owner-order-deletion.cjs tests/order-notes.test.js
          node tests/mobile-order-form.js
          node tests/finance-payroll-preview.js
          node tests/orders-compact-list.js
      - name: Paid order, salary roles, backup and release-gate regression contracts
        run: |
          node --test tests/paid-order-guard.test.cjs tests/roles-stage3.test.cjs tests/release-step06-gates.test.cjs tests/free-backup-local.test.cjs tests/step05-backup-restore.test.cjs
          node scripts/release-go-no-go.cjs --status
      - name: Push bell, splash, and read-only finance audit contracts
        run: |
          node tests/master-notifications.js
          node --test tests/startup-splash.test.cjs tests/finance-reconciliation-readonly.test.cjs tests/master-provisioning-contract.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit for synthetic browser tests
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Compact Raul cards in WebKit
        run: node tests/master-dense-layout.cjs
      - name: iPhone navigation with Chromium and WebKit (read-only mock data)
        run: |
          TEST_BROWSER=chromium node tests/mobile-nav-stability.cjs
          TEST_BROWSER=webkit node tests/mobile-nav-stability.cjs
      - name: Calendar date and order filters (read-only mock data)
        run: |
          CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" node tests/calendar-date-width.cjs
          CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" node tests/order-filters-mobile.cjs
      - name: Manual WhatsApp draft flow (no real sending)
        run: |
          CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" node tests/whatsapp-raul-browser.cjs
