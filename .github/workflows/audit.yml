name: CRM reliability audit
on:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: local-audit-only
          POSTGRES_DB: rabota_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: local-audit-only
      PGDATABASE: rabota_audit
      RABOTA_DISPOSABLE_DB: YES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PostgreSQL client tools from the matching disposable container
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTOOLS'
          import os
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'rabota-pg-tools'
          target.mkdir()
          for tool in ['psql','pg_dump','pg_restore','pg_dumpall','createdb','dropdb']:
              file=target/tool
              file.write_text('#!/bin/bash\nexec docker exec -i -e PGDATABASE="${PGDATABASE:-rabota_audit}" -e PGUSER=postgres '+os.environ['DB_CONTAINER']+' '+tool+' "$@"\n')
              file.chmod(0o755)
          with open(os.environ['GITHUB_PATH'],'a') as output: output.write(str(target)+'\n')
          PYTOOLS
      - name: Reproduce audited baseline in disposable PostgreSQL
        run: node --test tests/audit/database.cjs
      - name: Verify SQL fixes in disposable PostgreSQL
        env:
          AUDIT_FIXED: '1'
        run: node --test tests/audit/database.cjs
      - name: Unit regressions
        run: node --test tests/audit/client.cjs
      - name: Production contract, standalone C1, cutover, archive restore and safe rollback
        run: node --test tests/audit/deployment.cjs
      - name: Existing unit tests
        run: node --test tests/finance-payroll-preview.js tests/lead-assistant-preview.js tests/master-notifications.js tests/mobile-order-form.js tests/order-calendar-collapse.js tests/orders-compact-list.js tests/ui-icon-layout.test.js
      - name: Install pinned browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/rabota-tools" --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/rabota-tools/node_modules/.bin/playwright" install --with-deps webkit chromium
      - name: Read public production login page (GET only)
        run: |
          node -e 'fetch("https://rabota-rust.vercel.app/").then(async r => { const html=await r.text(); console.log(JSON.stringify({status:r.status,loginForm:html.includes("loginForm"),contentType:r.headers.get("content-type")})); if(!r.ok || !html.includes("loginForm")) process.exitCode=1; })'
      - name: WebKit mobile tests with all API calls intercepted
        env:
          NODE_PATH: ${{ runner.temp }}/rabota-tools/node_modules
        run: node tests/audit/mobile.cjs
      - name: Existing responsive browser suite on synthetic data
        env:
          NODE_PATH: ${{ runner.temp }}/rabota-tools/node_modules
        run: node tests/ui-smoke-v2.js
