name: Owner UI parity with Raul
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'owner-parity.js'
      - 'contextual-search.css'
      - 'redesign.js'
      - 'index.html'
      - 'app-services.js'
      - 'finance-model.js'
      - 'finance-payroll.*'
      - 'money-workspace.*'
      - 'profit-report.*'
      - 'expenses.*'
      - 'growth.*'
      - 'orders-workspace.css'
      - 'tests/module-navigation-browser.cjs'
      - 'tests/finance-stability-browser.cjs'
      - 'tests/startup-schedule-browser.cjs'
      - 'tests/mobile-nav-stability.cjs'
      - 'tests/ui-smoke-v2.js'
      - '.github/workflows/owner-ui-parity.yml'
  push:
    branches: [main, fix/integrated-crm-sections, fix/crm-stability]
    paths:
      - 'owner-parity.js'
      - 'contextual-search.css'
      - 'redesign.js'
      - 'index.html'
      - 'app-services.js'
      - 'finance-model.js'
      - 'finance-payroll.*'
      - 'money-workspace.*'
      - 'profit-report.*'
      - 'expenses.*'
      - 'growth.*'
      - 'orders-workspace.css'
      - 'tests/module-navigation-browser.cjs'
      - 'tests/finance-stability-browser.cjs'
      - 'tests/startup-schedule-browser.cjs'
      - 'tests/mobile-nav-stability.cjs'
      - 'tests/ui-smoke-v2.js'
      - '.github/workflows/owner-ui-parity.yml'
permissions:
  contents: read
jobs:
  owner-parity-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check redesign.js
          node --check orders-list.js
          node --check owner-parity.js
      - name: Shared session and finance model contracts
        run: node --test tests/app-services.test.cjs tests/finance-model.test.cjs
      - name: Install matching Playwright library
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Owner order list, status icons and fixed navigation in Chromium
        env:
          TEST_BROWSER: chromium
        run: |
          node tests/mobile-nav-stability.cjs
          node tests/module-navigation-browser.cjs
          node tests/finance-stability-browser.cjs
          node tests/startup-schedule-browser.cjs
      - name: Owner order list, status icons and fixed navigation in iPhone Safari
        env:
          TEST_BROWSER: webkit
        run: |
          node tests/mobile-nav-stability.cjs
          node tests/module-navigation-browser.cjs
          node tests/finance-stability-browser.cjs
