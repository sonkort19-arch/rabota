name: Build iOS launch images
on:
  push:
    branches:
      - fix/ios-native-launch-image-20261114
    paths:
      - scripts/generate_ios_splash.py
      - .github/workflows/generate-ios-launch-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check "Pillow==12.0.0" "CairoSVG==2.8.2"
      - name: Generate verified startup PNGs
        run: python scripts/generate_ios_splash.py
      - name: Verify expected physical sizes and PNG signatures
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for w,h in [(1170,2532),(1179,2556),(1206,2622),(1290,2796)]:
              path=Path(f"icons/startup/startup-{w}x{h}.png")
              assert path.exists(), path
              with Image.open(path) as image:
                  assert image.format=="PNG" and image.size==(w,h), path
              assert path.stat().st_size<100000, path
          PY
      - name: Commit generated assets to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/startup/startup-*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(ios): add four exact-size native launch images"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
