name: Master dashboard isolated checks
on:
  push:
    branches:
      - fix/raul-master-dashboard-20261112
  pull_request:
    paths:
      - index.html
      - master-dashboard.css
      - master-dense.css
      - tests/master-dashboard.cjs
      - tests/master-dense-layout.cjs
      - tests/master-owner-cards.cjs
      - finance-payroll.js
jobs:
  regressions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify master dashboard
        run: |
          node tests/master-dashboard.cjs
          node tests/master-owner-cards.cjs
          node tests/master-notifications.js
          node tests/finance-payroll-preview.js
          node tests/startup-splash.test.cjs
          node tests/orders-compact-list.js
          node tests/quick-slots.cjs
          node tests/owner-order-deletion.cjs
      - name: Install Safari WebKit runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Check mobile master density and touch targets
        run: node tests/master-dense-layout.cjs
