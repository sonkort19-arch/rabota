name: CRM safe checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-safe-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js api/*.js tests/*.js; do
            node --check "$file"
          done

      - name: Run synthetic offline regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.js
