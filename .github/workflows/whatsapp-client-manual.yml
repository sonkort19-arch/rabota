name: Client WhatsApp manual draft checks
on:
  push:
    branches:
      - feature/whatsapp-client-manual-preview-20261118
      - feature/whatsapp-message-settings-20261118
      - feature/review-links-by-client-source-20261118
      - feature/polish-client-whatsapp-texts-20261118
      - fix/whatsapp-settings-retry-and-safety-20261118
  pull_request:
    paths:
      - index.html
      - whatsapp-client.js
      - whatsapp-settings.js
      - whatsapp-settings.css
      - client-source.css
      - order-model.js
      - master-ui.js
      - money-workspace.js
      - redesign.js
      - tests/whatsapp-client.test.cjs
      - tests/whatsapp-client-flow.test.cjs
      - tests/whatsapp-settings.test.cjs
      - tests/client-source-review.test.cjs
      - tests/whatsapp-copy-polish.test.cjs
      - tests/whatsapp-safety-regression.test.cjs
      - tests/master-day-review-audit.test.cjs
      - .github/workflows/whatsapp-client-manual.yml
permissions:
  contents: read
jobs:
  manual-client-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: |
          node --check whatsapp-client.js
          node --check whatsapp-settings.js
          node --check money-workspace.js
          node --check redesign.js
          node --check order-model.js
          node --check master-ui.js
      - name: Targeted client message and integration tests
        run: node --test tests/whatsapp-client.test.cjs tests/whatsapp-client-flow.test.cjs tests/whatsapp-settings.test.cjs tests/client-source-review.test.cjs tests/whatsapp-copy-polish.test.cjs tests/whatsapp-safety-regression.test.cjs tests/master-day-review-audit.test.cjs
